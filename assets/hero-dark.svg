  <title id="ht">Mehrshad Zand — backend engineer, RFC 2324 compliant</title>
  <desc id="hd">Dark blueprint banner. A terminal reads GET /mehrshad HTTP/1.1, then 200 OK, then x-powered-by coffee with a blinking cursor. The name Mehrshad Zand sits above the tagline backend engineer, deletes caches, defends RFC 2324, with three chips: C# / .NET, systems that hold up, 418 approved. On the right, a line-drawn teapot with a lidded dome, steam curls and a small heart, standing on a saucer against a soft turquoise disc.</desc>
