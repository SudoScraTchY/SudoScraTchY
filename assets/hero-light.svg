<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="ht hd">
  <title id="ht">Mehrshad Zand — backend engineer</title>
  <desc id="hd">Blueprint-style banner with the name Mehrshad Zand, a terminal prompt, a tagline about C# and .NET backend work, three skill chips, and a faint Persian eight-point tile motif on the right.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
