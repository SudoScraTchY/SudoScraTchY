  <desc id="hd">Light blueprint banner. A terminal reads: GET /mehrshad HTTP/1.1, HTTP/1.1 200 OK, x-powered-by: coffee with a blinking cursor. The name Mehrshad Zand sits above the tagline backend engineer, deletes caches, defends RFC 2324. Three chips read C# / .NET, systems that hold up, 418 approved. On the right, a line-art teapot with animated steam and a small saffron heart, framed by a faint Persian eight-point tile motif.</desc>
